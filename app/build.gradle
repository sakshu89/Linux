plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

android {
    namespace 'com.project.sonic'
    compileSdk 36

    // The thousands of JADX-decompiled .java files in this tree are not valid
    // Java (broken enums, interface initializers, unknown types). Only the
    // hand-written Kotlin runtime is compiled; the decompiled sources are
    // kept in the repo for reference.
    sourceSets {
        main {
            java {
                exclude '**/*.java'
            }
        }
    }
    defaultConfig {
        applicationId 'com.project.linux'
        minSdk 26
        targetSdk 36
        versionCode 3000
        versionName '3.0-Linux'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -O2' } }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.6' } }
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'androidx.datastore:datastore-preferences:1.1.7'
    implementation 'androidx.compose.ui:ui:1.10.4'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.10.4'
    implementation 'androidx.compose.foundation:foundation:1.10.4'
    implementation 'androidx.compose.material3:material3:1.4.0'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.dagger:hilt-android:2.60.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.82'
    implementation 'com.ibm.icu:icu4j:77.1'
}
