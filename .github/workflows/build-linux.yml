name: Build Linux Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.31.6"

      - name: Fetch llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp

      - name: Fetch Cactus
        run: |
          git clone --depth 1 https://github.com/cactus-compute/cactus.git third_party/cactus
          python3 -m pip install --upgrade pip
          python3 -m pip install -U cactus-compute
          cd third_party/cactus
          source ./setup
          cactus build --android
          mkdir -p lib/arm64-v8a
          if [ -f android/libcactus.so ]; then cp android/libcactus.so lib/arm64-v8a/libcactus.so; fi
          if [ -f android/libcactus_engine.so ]; then cp android/libcactus_engine.so lib/arm64-v8a/libcactus.so; fi

      - name: Copy Cactus headers
        run: |
          mkdir -p third_party/cactus/include
          if [ -f third_party/cactus/cactus_engine.h ]; then cp third_party/cactus/cactus_engine.h third_party/cactus/include/; fi
          find third_party/cactus -name 'cactus_engine.h' -o -name 'cactus.h' | head -20

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Linux-debug-apk
          path: app/build/outputs/apk/debug/*.apk
