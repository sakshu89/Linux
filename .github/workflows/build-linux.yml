name: Build Linux Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          sdkmanager --install             "platforms;android-36"             "build-tools;35.0.0"             "ndk;28.0.13004108"             "cmake;3.31.6"

      - name: Fetch llama.cpp
        run: |
          mkdir -p third_party
          git clone --depth 1             https://github.com/ggml-org/llama.cpp.git             third_party/llama.cpp

      - name: Fetch Cactus Android engine
        run: |
          set -eux
          python3 -m pip install --upgrade pip
          python3 -m pip install -U cactus-compute

          mkdir -p third_party/cactus
          cactus download android-arm64 --out third_party/cactus
          ls -la third_party/cactus/android-arm64

          mkdir -p third_party/cactus/include
          mkdir -p third_party/cactus/lib/arm64-v8a
          cp third_party/cactus/android-arm64/cactus.h third_party/cactus/include/cactus.h
          cp third_party/cactus/android-arm64/libcactus.a third_party/cactus/lib/arm64-v8a/libcactus.a

      - name: Verify native dependencies
        run: |
          set -eux
          test -f third_party/llama.cpp/CMakeLists.txt
          test -f third_party/cactus/include/cactus.h
          test -f third_party/cactus/lib/arm64-v8a/libcactus.a

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --info

      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Linux-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
